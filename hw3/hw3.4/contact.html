<main>
    <nav class="contact_container">

    <h1>Contact Us</h1>
    <p>We'd love to hear from you! Please fill out the form below and we will get back to you as soon as possible.</p>

    <form action="contact.html" method="POST">
        <div class="form_group">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>
        <div class="form_group">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form_group">
            <label for="message">Your Message</label>
            <textarea id="message" name="message" rows="4" placeholder="Write your message" required></textarea>
        </div>
        <button type="submit">Send Message</button>
    </form>
    </nav>
</main>

</body>
